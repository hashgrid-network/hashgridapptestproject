name: Build HashGrid APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate App Keystore & Print SHA-1
        run: |
          mkdir -p app
          keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp app/debug.keystore debug.keystore 2>/dev/null || true
          echo "=== SHA-1 FINGERPRINT FOR FIREBASE ==="
          keytool -list -v -keystore app/debug.keystore -alias androiddebugkey -storepass android | grep -E "SHA1|SHA256"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Prepare Direct APK Asset
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/app-debug.apk release_apk/HashGrid-v1.0.apk 2>/dev/null || cp app/build/outputs/apk/**/*.apk release_apk/HashGrid-v1.0.apk

      - name: Upload Artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: HashGrid-App
          path: app/build/outputs/apk/**/*.apk

      - name: Publish Direct 1-Tap APK Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: latest
          name: "HashGrid Latest Direct APK"
          body: "⚡ Official HashGrid direct 1-tap APK download (No ZIP extraction needed). Tap to install directly on Android."
          prerelease: false
          files: release_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
