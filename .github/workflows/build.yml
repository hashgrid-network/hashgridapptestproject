name: Build HashGrid APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ -f debug.keystore ] && [ ! -f app/debug.keystore ]; then
            cp debug.keystore app/debug.keystore 2>/dev/null || true
          fi

      - name: Print Keystore SHA Fingerprints for Firebase
        run: |
          KEY_PATH="app/debug.keystore"
          if [ ! -f "$KEY_PATH" ]; then KEY_PATH="debug.keystore"; fi
          if [ -f "$KEY_PATH" ]; then
            echo "================ KEYSTORE FINGERPRINTS ================"
            keytool -list -v -keystore "$KEY_PATH" -alias androiddebugkey -storepass android || true
            echo "======================================================="
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HashGrid-App
          path: app/build/outputs/apk/**/*.apk
